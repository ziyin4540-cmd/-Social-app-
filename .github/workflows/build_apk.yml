name: Build Android Release APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK (Version 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Re-create Android Platform Files
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.dark.social

      - name: Enable Core Library Desugaring for Notifications
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i '/defaultConfig {/a \    multiDexEnabled true' android/app/build.gradle
            sed -i '/compileOptions {/a \    isCoreLibraryDesugaringEnabled true' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/defaultConfig {/a \        multiDexEnabled = true' android/app/build.gradle.kts
            sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          fi
          echo "dependencies { coreLibraryDesugaring('com.android.tools:desugar_jdk_libs:2.0.4') }" >> android/app/build.gradle || true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          
